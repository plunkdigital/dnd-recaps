[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-recaps"
version = "0.1.0"
description = "Local session archive, audio transcription, and evidence-based D&D recaps"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cuda = [
  "faster-whisper>=1.2,<2",
  "av>=18,<19",  # faster-whisper 1.2.1 uses metadata_errors, removed in PyAV 19.
  "ctranslate2>=4.8,<5",
  "nvidia-cublas-cu12; platform_system == 'Linux'",
  "nvidia-cudnn-cu12>=9,<10; platform_system == 'Linux'",
]
diarization = [
  "pyannote.audio==4.0.7",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcodec==0.11.0",
]

[project.scripts]
dnd-recaps = "dnd_recaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
